<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="CAIC - Streaming inteligente multiplataforma (Web, Celular e Android TV) com IA e curadoria em tempo real." />
    <title>CAIC - Streaming Inteligente</title>
    <style>
      html, body {
        background-color: #020617 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        console.error('CAIC TV Error:', e.message, e.filename, e.lineno);
        var errDiv = document.getElementById('app-loading-screen');
        if (errDiv) {
          errDiv.innerHTML = '<div style="font-size:42px;margin-bottom:12px;">⚠️</div>' +
            '<h2 style="color:#ef4444;margin:0 0 8px 0;font-size:20px;">Falha ao carregar na TV Box</h2>' +
            '<p style="color:#cbd5e1;font-size:13px;max-width:440px;margin:0 auto 12px auto;line-height:1.5;">' + (e.message || 'Erro de execução de script') + '</p>' +
            '<p style="color:#94a3b8;font-size:11px;">Dica: Abra a Google Play Store na sua TV Box e atualize o "Android System WebView".</p>';
        }
      });
    </script>
  </head>
  <body style="background-color: #020617; color: #ffffff;">
    <div id="root">
      <div id="app-loading-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #020617; color: #ffffff; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
        <div style="font-size: 52px; margin-bottom: 16px; animation: pulse 1.5s infinite;">🍿</div>
        <h1 style="margin: 0 0 8px 0; font-size: 24px; font-weight: 800; color: #38bdf8; letter-spacing: 0.5px;">CAIC - Cinema &amp; IA</h1>
        <p style="margin: 0; font-size: 14px; color: #94a3b8;">Iniciando catálogo e recursos para sua tela...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
